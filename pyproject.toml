[build-system]
requires = ["setuptools>=69", "wheel>=0.42"]
build-backend = "setuptools.build_meta"

[project]
name = "gl1f-forest"
version = "0.2.3"
description = "Integer-quantized GBDT training and deterministic GL1F inference"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Mikhail Fedorov" }
]
dependencies = [
  "numpy>=1.26,<3"
]

[project.optional-dependencies]
mint = [
  "web3>=7,<8",
  "eth-account>=0.13,<0.14",
  "python-dotenv>=1,<2",
  "pillow>=10,<13",
]

[project.scripts]
gl1f-train = "train_gl1f:main"
gl1f-mint = "mint_model:main"

[tool.setuptools]
py-modules = ["train_gl1f", "local_trainer_server", "gl1f_validate", "mint_model", "mint_workflow"]

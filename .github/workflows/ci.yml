name: verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  client-and-runtime:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: python -m pip install --require-hashes -r requirements-evidence-linux-x86_64.txt
      - run: npm ci
      - run: npm run verify

  strict-cpp:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: >-
          g++-13 -O2 -std=c++17 -ffp-contract=off -fno-fast-math
          -Wall -Wextra -pedantic cpp/train_gl1f_cpp.cpp
          -o /tmp/train_gl1f_cpp
      - run: /tmp/train_gl1f_cpp --help
